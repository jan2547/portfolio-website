<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Portfolio</title>
  <link rel ="stylesheet" href ="style.css">
  <script src="script.js" defer></script>
</head>
<body>
<!-- Navigation bar -->
   <header class="navbar">
     <a href ="#home" class ="logo">PORTFOLIO.</a>
     <nav class="nav-links">
       <a href="#about">About</a>
       <a href="#projects">Projects</a>
       <a href="#contact">Contact</a>
     </nav>
   </header>

   <main>
     <!-- Home section -->
     <section id="home">
       <p class = "intro" > COMPUTER ENGINEERING STUDENT</p>
       <h1>
         Building software.<br>
         <span> Creating experiences</span>
       </h1>
      <p class=" description"> Embedded Systems • Game Development • Creative Engineering</p>
       <!-- Links to my projects and GitHub -->
       <div class="hero-buttons">
         <a href="#projects" class="btn primary">
           View Projects
         </a>
         <a href="https://github.com/jan2547" class="btn secondary"
         target="_blank" rel ="noopener noreferrer">
            Github
         </a>
       </div>
     </section>
     <!-- --Projects section ---->
     <section id="projects">
       <!-- title and scroll buttons -->
       <div class="projects-heading">
         <h2>Projects</h2>

         <div class="projects-control">
           <button id="scroll-left" type="button" aria-label="Scroll left">
             &#10094;
           </button>

           <button id="scroll-right" type="button" aria-label="Scroll right">
             &#10095;
           </button>
         </div>
       </div>


       <!-- projects will be added here using JavaScript -->
       <div class="project-grid"></div>

       <!-- template for each project card -->
       <template id="project-template">
         <div class="project-card">

           <div class="project-image">
             Image coming soon
           </div>

           <h3 class="project-name"></h3>
           <p class="project-description"></p>

           <div class="tech-stack"></div>

           <a class="code-link"
              target="_blank"
              rel="noopener noreferrer">

             <!-- github icon -->
             <svg width="22" height="22"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  aria-hidden="true">
               <path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22"/>
             </svg>

             View Code
           </a>

         </div>
       </template>

     </section>
     <!-- TODO: Add About and Contact sections later -->





   </main>
</body>
</html>
